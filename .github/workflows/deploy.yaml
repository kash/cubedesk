on:
    workflow_call:
        inputs:
            ECR_REPOSITORY:
                required: true
                type: string
            ECS_CLUSTER:
                required: true
                type: string
            ECS_SERVICE:
                required: true
                type: string
            TASK_DEFINITION:
                required: true
                type: string
            CONTAINER_NAME:
                required: true
                type: string
            DATABASE_SECRET_ID:
                required: true
                type: string
            S3_BUCKET:
                required: true
                type: string
            ENV:
                required: true
                type: string
            RESOURCES_BASE_URI:
                required: true
                type: string
            DIST_BASE_URI:
                required: true
                type: string
        secrets:
            SENTRY_AUTH_TOKEN:
                required: true

jobs:
    deploy:
        # CodeBuild-hosted runner inside the VPC: AWS credentials come from the CodeBuild project's role,
        # and migrations can reach the private RDS instance
        runs-on:
            - codebuild-prod-${{ github.run_id }}-${{ github.run_attempt }}
        # Queue back-to-back pushes instead of running two rollouts at once
        concurrency:
            group: deploy-${{ inputs.ECS_SERVICE }}
            cancel-in-progress: false
        env:
            AWS_REGION: us-west-2

        steps:
            - name: Checkout Latest Repo
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Nodejs with pnpm caching
              uses: actions/setup-node@v5
              with:
                  node-version: "24"
                  cache: pnpm

            - name: Generate release identifiers
              id: release
              run: |
                  echo "deployment_id=$(cat /proc/sys/kernel/random/uuid)" >> "$GITHUB_OUTPUT"
                  echo "name=release-$(date -u +'%Y-%m-%dT%H-%M-%SZ')" >> "$GITHUB_OUTPUT"

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Set image name
              id: image
              run: echo "uri=${{ steps.login-ecr.outputs.registry }}/${{ inputs.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build client and server
              env:
                  ENV: ${{ inputs.ENV }}
                  RELEASE_NAME: ${{ steps.release.outputs.name }}
                  DEPLOYMENT_ID: ${{ steps.release.outputs.deployment_id }}
                  DIST_BASE_URI: ${{ inputs.DIST_BASE_URI }}
                  RESOURCES_BASE_URI: ${{ inputs.RESOURCES_BASE_URI }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  # Bundling every server dependency with source maps needs ~4.5 GB of heap, just over
                  # Node's default limit, which makes the server build thrash instead of finishing
                  NODE_OPTIONS: --max-old-space-size=6144
              run: |
                  # prisma.config.ts requires DATABASE_URL, but generating the client never connects
                  DATABASE_URL=postgresql://placeholder pnpm exec prisma generate
                  pnpm run build
                  # Source maps are uploaded to Sentry during the build and must not be served
                  find dist build -name "*.map" -type f -delete

            # Never --delete: bundle file names are unique per deploy, and older pages still reference previous bundles
            - name: Upload static assets to S3
              run: |
                  aws s3 sync dist s3://${{ inputs.S3_BUCKET }}/dist --cache-control max-age=604800
                  aws s3 sync public s3://${{ inputs.S3_BUCKET }}/static --size-only --cache-control max-age=604800

            # The platform must match the task definition's CPU architecture
            - name: Build image
              run: |
                  docker build . --platform linux/arm64 --tag ${{ steps.image.outputs.uri }} \
                    --build-arg DEPLOYMENT_ID=${{ steps.release.outputs.deployment_id }} \
                    --build-arg RELEASE_NAME=${{ steps.release.outputs.name }}

            # Without REDIS_URL the server serves HTTP but never starts Redis, Discord, cron, or sockets
            - name: Smoke test image
              run: |
                  docker run --detach --name smoke --publish 3000:3000 --env ENV=${{ inputs.ENV }} ${{ steps.image.outputs.uri }}
                  curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors http://localhost:3000/health \
                    || { docker logs smoke; exit 1; }
                  docker rm --force smoke

            - name: Push image to Amazon ECR
              run: docker push ${{ steps.image.outputs.uri }}

            # Env vars live in the task definition itself, so only the image changes per deploy
            - name: Download task definition
              run: |
                  aws ecs describe-task-definition --task-definition ${{ inputs.TASK_DEFINITION }} --query taskDefinition > task-definition.json

            - name: Fill in the new image in the task definition
              id: task-def
              uses: aws-actions/amazon-ecs-render-task-definition@v1
              with:
                  task-definition: task-definition.json
                  container-name: ${{ inputs.CONTAINER_NAME }}
                  image: ${{ steps.image.outputs.uri }}

            - name: Run database migrations
              run: |
                  DATABASE_URL=$(aws secretsmanager get-secret-value --secret-id ${{ inputs.DATABASE_SECRET_ID }} --query SecretString --output text)
                  if [ -z "$DATABASE_URL" ]; then
                    echo "::error::Could not read ${{ inputs.DATABASE_SECRET_ID }} from Secrets Manager"
                    exit 1
                  fi
                  echo "::add-mask::$DATABASE_URL"
                  export DATABASE_URL
                  pnpm exec prisma migrate deploy

            - name: Deploy to ECS
              uses: aws-actions/amazon-ecs-deploy-task-definition@v2
              with:
                  task-definition: ${{ steps.task-def.outputs.task-definition }}
                  service: ${{ inputs.ECS_SERVICE }}
                  cluster: ${{ inputs.ECS_CLUSTER }}
                  wait-for-service-stability: true
