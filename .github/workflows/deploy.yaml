on:
    workflow_call:
        inputs:
            ECR_REPOSITORY:
                required: true
                type: string
            ECS_CLUSTER:
                required: true
                type: string
            ECS_SERVICE:
                required: true
                type: string
            TASK_DEFINITION:
                required: true
                type: string
            CONTAINER_NAME:
                required: true
                type: string
            DATABASE_SECRET_ID:
                required: true
                type: string
            S3_BUCKET:
                required: true
                type: string
            ENV:
                required: true
                type: string
            RESOURCES_BASE_URI:
                required: true
                type: string
            DIST_BASE_URI:
                required: true
                type: string
        secrets:
            SENTRY_AUTH_TOKEN:
                required: true

jobs:
    deploy:
        runs-on:
            - codebuild-prod-${{ github.run_id }}-${{ github.run_attempt }}
        concurrency:
            group: deploy-${{ inputs.ECS_SERVICE }}
            cancel-in-progress: false
        env:
            AWS_REGION: us-west-2

        steps:
            - name: Checkout Latest Repo
              uses: actions/checkout@v5

            - name: Setup Nodejs
              uses: actions/setup-node@v5
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Setup pnpm
              id: pnpm
              env:
                  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
              run: |
                  corepack enable
                  echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - name: Cache pnpm store
              uses: actions/cache@v6
              with:
                  path: ${{ steps.pnpm.outputs.store }}
                  key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

            - name: Generate release identifiers
              id: release
              run: |
                  echo "deployment_id=$(cat /proc/sys/kernel/random/uuid)" >> "$GITHUB_OUTPUT"
                  echo "name=release-$(date -u +'%Y-%m-%dT%H-%M-%SZ')" >> "$GITHUB_OUTPUT"

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Set image name
              id: image
              run: echo "uri=${{ steps.login-ecr.outputs.registry }}/${{ inputs.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build client and server
              env:
                  ENV: ${{ inputs.ENV }}
                  RELEASE_NAME: ${{ steps.release.outputs.name }}
                  DEPLOYMENT_ID: ${{ steps.release.outputs.deployment_id }}
                  DIST_BASE_URI: ${{ inputs.DIST_BASE_URI }}
                  RESOURCES_BASE_URI: ${{ inputs.RESOURCES_BASE_URI }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  NODE_OPTIONS: --max-old-space-size=6144
              run: |
                  DATABASE_URL=postgresql://placeholder pnpm exec prisma generate
                  pnpm run build
                  find dist build -name "*.map" -type f -delete

            - name: Upload static assets to S3
              run: |
                  aws s3 sync dist s3://${{ inputs.S3_BUCKET }}/dist --cache-control max-age=604800
                  aws s3 sync public s3://${{ inputs.S3_BUCKET }}/static --size-only --cache-control max-age=604800

            - name: Build image
              run: |
                  docker build . --platform linux/arm64 --tag ${{ steps.image.outputs.uri }} \
                    --build-arg DEPLOYMENT_ID=${{ steps.release.outputs.deployment_id }} \
                    --build-arg RELEASE_NAME=${{ steps.release.outputs.name }}

            - name: Smoke test image
              run: |
                  docker run --detach --name smoke --publish 3000:3000 --env ENV=${{ inputs.ENV }} ${{ steps.image.outputs.uri }}
                  curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors http://localhost:3000/health \
                    || { docker logs smoke; exit 1; }
                  docker rm --force smoke

            - name: Push image to Amazon ECR
              run: docker push ${{ steps.image.outputs.uri }}

            - name: Download task definition
              run: |
                  aws ecs describe-task-definition --task-definition ${{ inputs.TASK_DEFINITION }} --query taskDefinition > task-definition.json

            - name: Fill in the new image in the task definition
              id: task-def
              uses: aws-actions/amazon-ecs-render-task-definition@v1
              with:
                  task-definition: task-definition.json
                  container-name: ${{ inputs.CONTAINER_NAME }}
                  image: ${{ steps.image.outputs.uri }}

            - name: Run database migrations
              run: |
                  DATABASE_URL=$(aws secretsmanager get-secret-value --secret-id ${{ inputs.DATABASE_SECRET_ID }} --query SecretString --output text)
                  if [ -z "$DATABASE_URL" ]; then
                    echo "::error::Could not read ${{ inputs.DATABASE_SECRET_ID }} from Secrets Manager"
                    exit 1
                  fi
                  echo "::add-mask::$DATABASE_URL"
                  export DATABASE_URL
                  pnpm exec prisma migrate deploy

            - name: Deploy to ECS
              uses: aws-actions/amazon-ecs-deploy-task-definition@v2
              with:
                  task-definition: ${{ steps.task-def.outputs.task-definition }}
                  service: ${{ inputs.ECS_SERVICE }}
                  cluster: ${{ inputs.ECS_CLUSTER }}
                  wait-for-service-stability: true
                  wait-max-delay-seconds: 15
